# 🐄 PROCAMPO (fazendas Piracanjuba fora do SmartQuestion, identificadas pelo código PRO no Elabore)
procampo:
  id_agroindustry: "098fc29f-3f54-4186-8529-1a4945fbaef3"   # Piracanjuba no Elabore (vw_dim_property.id_agroindustry)
  padrao_codigo: "^PRO[0-9]{4}$"                            # não usar LIKE 'PRO%': PRODUTOR_TESTE também casa
  # Visitas: 1 arquivo por mês de exportação (AAAA_MM_VISITAS_PIRACANJUBA_ESTEIO.xlsx). O histórico fica em
  # BD_PROCAMPO/VISITAS; o(s) arquivo(s) do mês corrente ficam direto em BD_PROCAMPO. O nome do arquivo NÃO é o mês
  # das visitas (o 2026_10 traz visitas de 21 a 28/09): a mesma visita pode estar em dois arquivos, vale a do mais novo.
  pasta_visitas_historico: "VISITAS"
  padrao_arquivo_visitas: "*_VISITAS_PIRACANJUBA_ESTEIO.xlsx"
  aba_visitas: "Sheet1"
  linha_cabecalho_visitas: 1                                # a linha 0 é o título "Relatório de visitas"
  limite_remocao_visitas_pct: 0.10                          # a raw espelha os arquivos; aborta se mais que isso sumir (arquivo movido?)
  arquivo_base: "BASE_PRODUTORES_PROCAMPO_PIRACANJUBA.xlsx"   # base mestra: abas ATIVOS + ROTATIVIDADE
  aba_base_ativos: "ATIVOS"
  aba_base_rotatividade: "ROTATIVIDADE"
  prefixo_codigo_provisorio: "MAT"                          # fazenda fora do Elabore: MAT + matrícula (cadastro é do consultor)
  agroindustria_bi: "Piracanjuba"
  projeto_bi: "PROCAMPO"
  unidade_atendimento_bi: "PROCAMPO"                        # marca as linhas do Procampo em tab_dim_fazendas_ativas
  # Fazenda LR###### da Piracanjuba (Regenera/Alvoar) é gerenciada pelo SmartQuestion: as visitas da planilha do
  # Procampo nessas fazendas ficam só na pro_raw_visitas e na auditoria. Mudar para true se o coordenador decidir
  # que elas contam (elas entram na tab_fato_visitas com origem_dados = PROCAMPO, ligadas ao código LR).
  contar_visitas_em_fazenda_lr: false
  # O mesmo consultor tem grafias diferentes na base mestra e nas planilhas de visitas (sem acento, maiúsculas):
  # variante -> nome canônico. Sem isso ele apareceria duas vezes no BI (na carteira e nas visitas).
  # CONFIRMAR o nome canônico de cada um (escolhido o mais completo).
  aliases_consultor:
    "BRUNO FERRONI RODRIGUES": "BRUNO ANTONIO FERRONI RODRIGUES"
    "FRANCISCO HENRIQUE GRANVILLE": "FRANCISCO HENRIQUE GRANVILLE DE OLIVEIRA"
    "HUGO HENRIQUE MARTIN CAMPOS": "HUGO HENRIQUE MARTINS CAMPOS"
    "JOSE AUGUSTO MENDES DOS SANTO": "JOSE AUGUSTO MENDES DOS SANTOS"
    "MARCOS PAULO FLECHA": "MARCOS PAULO DE PINHO FLECHA"
    "MARIA FERRO MENDONCA": "MARIA FERRO CONSTANCIO MENDONCA"
    "MATEUS ALCANTARA JARDIM": "MATHEUS ALCANTARA JARDIM"
    "TASSO VILELA VIANA": "TASSO VILELA LEMOS VIANA"
    "WELLINGTON MARTINS": "WELLINGTON MARTINS GOMES"
    "LUCAS GONCAVES E SILVA FERREIRA": "LUCAS GONCALVES E SILVA FERREIRA"          # erro de digitação na base (8 fazendas)
    "GUSTAVO GOUVEIA FONSECA - PROLE CONSULTORIA - 10005195": "GUSTAVO GOUVEIA FONSECA"   # sufixo da consultoria na base
    "TIAGO MASSING - ALLIANCE": "TIAGO MASSING"                                     # sufixo da consultoria na base
  # Sigla de PROPRIEDADE.REGIONAL da base -> nome da região no Elabore (= tab_dim_regiao / Piracanjuba)
  regioes_por_sigla:
    CCO: "CCO - Centro Oeste"
    CCS: "CCS - Centro Sul"
    CND: "CND - Nordeste"
    NSG: "CND - Nordeste"                                   # NSG é Nordeste
    CSE: "CSE - Sudeste"
    CSU: "CSU - Sul"

# 🥛 PRODUÇÃO E QUALIDADE DO LEITE (tab_fato_producao_mensal, construída em camada_consumo.py)
producao:
  # Registro suspeito: produtividade fora desta faixa (L/vaca/dia) ou volume que salta N vezes acima/abaixo da
  # mediana do próprio produtor. Calibrado no dashboard HTML da Piracanjuba (V2).
  produtividade_min: 3.0
  produtividade_max: 55.0
  fator_salto: 3.0
  # true: o volume suspeito é substituído pela média dos demais meses válidos do produtor (o bruto fica em
  # producao_l_dia_bruto e a linha é marcada em producao_imputada). Sem mês válido, fica sem volume.
  imputar_suspeitos: true
  # Limites da normativa brasileira de qualidade do leite (IN 76/77), em mil/mL: acima disso a linha é marcada
  # em ccs_acima_limite / cpp_acima_limite (a API só conta as marcas).
  limite_ccs: 500
  limite_cpp: 300
  # Faixas plausíveis dos campos de qualidade. Zero é "não medido"; valor positivo fora da faixa é erro de
  # digitação na visita (ex.: gordura 4902 %, CCS 834000) e é descartado (fica nulo) e a linha
  # é marcada em qualidade_descartada, para não estragar a média ponderada.
  faixa_ccs: [1, 5000]
  faixa_cpp: [1, 5000]
  faixa_gordura: [1, 10]
  faixa_proteina: [1.5, 7]
  # A CCS destas agroindústrias vem em escala diferente das demais (Danone/Semear: mediana ~11.700 contra ~400).
  # Enquanto a origem não for esclarecida, a CCS delas não entra nos indicadores.
  agroindustrias_sem_ccs_confiavel: ["Danone"]

# 🌽 INDICADORES DE SAFRA (slide 7; tab_fato_safra_forrageira, construída em camada_consumo.py)
safra_forrageira:
  # A raw espelha a base mais recente; aborta sem remover nada se sumirem mais linhas que isto (planilha incompleta).
  limite_remocao_pct: 0.2
  # Produção entra no custo/produtividade só se for consistente na origem: com quantidade colhida, sem ciclo
  # divergente, sem alerta de custo/ha (>= R$ 50 mil/ha) e com categoria VOLUMOSO ou CONCENTRADO (o "REVISAR: ..."
  # da origem fica de fora). As descartadas são contadas em producoes_inconsistentes.
  categorias_validas: ["VOLUMOSO", "CONCENTRADO"]
  # Plantio conta como "com cobertura" quando o talhão recebe, até 365 dias depois, planta de cobertura declarada
  # (cobertura) ou também cultivo de 2ª/3ª safra (sucessao). "sucessao" reproduz o HTML do Semear (Danone).
  regra_cobertura: "sucessao"

# ⚙️ PARÂMETROS DE EXECUÇÃO DO PIPELINE
execucao:
  chunk_size_upsert: 1000              # Tamanho do lote oficial para envio ao Supabase (1000 registros por lote)
  pausa_lote_segundos: 0.05            # Pausa mínima entre lotes para aceleração máxima do ETL
  formato_data: "%Y-%m-%d"
  encoding: "utf-8"

# 📅 PARÂMETROS TEMPORAIS E DATAS DE CORTE
referencia:
  mes_referencia: "2026-08-01"            # Mês de referência oficial da análise (AAAA-MM ou AAAA-MM-DD)
  periodo_checagem_inicio: "2024-01-01"   # Início do período amplo de checagem
  data_inicial_analise: "2025-01-01"      # Data inicial padrão para consistência e análises gerais
  data_inicial_elabore: "2025-12-01"      # Data inicial específica do projeto Elabore
  data_corte_estatica_visitas: "2026-06-30" # Data limite final da carga estática/histórica congelada (até 2026/1)
  data_inicial_fato_visitas: "2026-07-01"   # Data inicial oficial da carga dinâmica por UPSERT (2026/2 em diante)
  ano_filtro_inicio: 2024                 # Ano inicial de filtragem para bases históricas
  meses_consecutivos_minimos: 12          # Quantidade mínima de meses consecutivos
