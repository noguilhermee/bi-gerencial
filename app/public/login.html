<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar | Labor Rural</title>
  <link rel="icon" type="image/png" href="./img/lr.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/login.css?v=20261007-7">
</head>
<body>
  <div class="brand">
    <span class="brand-mark"><img src="./img/elabore-logo-build.png" alt="Labor Rural"></span>
    <h2 class="brand-title">BI Gerencial</h2>
    <p class="brand-sub">inteligência para o agronegócio</p>
  </div>
  <a class="help" id="ajuda" href="#" role="button"><span class="help-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M9.3 9.4a2.8 2.8 0 1 1 4.1 2.5c-.9.5-1.4 1.1-1.4 2.1"/><circle cx="12" cy="17.2" r=".6" fill="currentColor"/></svg></span>Precisa de ajuda?</a>
  <main class="login-card">
    <h1>Seja bem-vindo(a)!</h1>
    <form id="novaSenhaForm" novalidate hidden>
      <label>Nova senha * (mínimo 8 caracteres)
        <div class="pw">
          <input id="novaSenha" type="password" autocomplete="new-password" minlength="8" required>
          <button class="eye" type="button" data-alvo="novaSenha" aria-label="Mostrar senha">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </label>
      <label>Repita a nova senha *
        <div class="pw">
          <input id="novaSenha2" type="password" autocomplete="new-password" minlength="8" required>
          <button class="eye" type="button" data-alvo="novaSenha2" aria-label="Mostrar senha">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </label>
      <button class="primary" id="salvarSenha" type="submit">SALVAR SENHA</button>
      <p class="msg" id="msgSenha" role="alert"></p>
    </form>
    <form id="loginForm" novalidate>
      <label for="email">E-mail *</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="senha">Senha *</label>
      <div class="pw">
        <input id="senha" type="password" autocomplete="current-password" required>
        <button class="eye" id="verSenha" type="button" data-alvo="senha" aria-label="Mostrar senha">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <button class="link" id="esqueci" type="button">Esqueceu sua senha?</button>
      <button class="primary" id="entrar" type="submit">ENTRAR</button>
      <p class="msg" id="msg" role="alert"></p>
    </form>
  </main>
  <footer class="copy">© Labor Rural | 2026</footer>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./js/auth.js?v=20261005-1"></script>
  <script>
    // Enquanto o usuário digita, o servidor já carrega as tabelas no cache (a resposta é vazia; não expõe dado)
    fetch('/api/aquecer', { cache: 'no-store', keepalive: true }).catch(() => {});
  </script>
  <script>
    (async () => {
      const msg = document.getElementById('msg');
      const botao = document.getElementById('entrar');
      const aviso = (texto, ok) => { msg.textContent = texto; msg.classList.toggle('ok', !!ok); };
      const client = await LRAuth.client();

      document.querySelectorAll('.eye').forEach((olho) => olho.addEventListener('click', () => {
        const s = document.getElementById(olho.dataset.alvo);
        s.type = s.type === 'password' ? 'text' : 'password';
        olho.setAttribute('aria-label', s.type === 'password' ? 'Mostrar senha' : 'Ocultar senha');
      }));
      document.getElementById('ajuda').addEventListener('click', (e) => {
        e.preventDefault();
        aviso('Precisa de ajuda? Fale com o time de Analytics da Labor Rural.', true);
      });

      // Link de redefinição de senha: pede a nova senha em vez de entrar direto
      const params = new URLSearchParams(location.hash.replace(/^#/, ''));
      if (params.get('error_description')) aviso('O link expirou ou já foi usado. Peça um novo em "Esqueci minha senha".');
      if (params.get('type') === 'recovery') {
        document.getElementById('loginForm').hidden = true;
        const form = document.getElementById('novaSenhaForm');
        const msgSenha = document.getElementById('msgSenha');
        const campo1 = document.getElementById('novaSenha');
        const campo2 = document.getElementById('novaSenha2');
        // Borda vermelha enquanto a confirmação não bate com a nova senha
        const conferir = () => {
          const diferente = campo2.value !== '' && campo1.value !== campo2.value;
          campo1.classList.toggle('erro', diferente);
          campo2.classList.toggle('erro', diferente);
          if (!diferente && msgSenha.textContent === 'As senhas não coincidem.') msgSenha.textContent = '';
          return !diferente;
        };
        campo1.addEventListener('input', conferir);
        campo2.addEventListener('input', conferir);
        form.hidden = false;
        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          const a = campo1.value;
          if (a.length < 8) { msgSenha.textContent = 'Use pelo menos 8 caracteres.'; return; }
          if (a !== campo2.value) { campo1.classList.add('erro'); campo2.classList.add('erro'); msgSenha.textContent = 'As senhas não coincidem.'; return; }
          const { error } = await client.auth.updateUser({ password: a });
          if (error) { msgSenha.textContent = 'Não foi possível salvar a senha. Peça um novo link.'; return; }
          // Senha salva: encerra a sessão do link e volta para o login, para entrar com a nova senha
          await client.auth.signOut().catch(() => {});
          history.replaceState(null, '', location.pathname);
          form.hidden = true;
          document.getElementById('loginForm').hidden = false;
          aviso('Senha alterada com sucesso. Entre com a nova senha.', true);
        });
      } else if (await LRAuth.sessaoValida()) { location.replace('/'); return; }

      document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        aviso('');
        botao.disabled = true;
        const { error } = await client.auth.signInWithPassword({
          email: document.getElementById('email').value.trim(),
          password: document.getElementById('senha').value
        });
        botao.disabled = false;
        if (error) return aviso('E-mail ou senha incorretos.');
        location.replace('/');
      });

      document.getElementById('esqueci').addEventListener('click', async () => {
        const email = document.getElementById('email').value.trim();
        if (!email) return aviso('Digite seu e-mail para receber o link de redefinição.');
        const { error } = await client.auth.resetPasswordForEmail(email, { redirectTo: `${location.origin}/login` });
        aviso(error ? 'Não foi possível enviar o e-mail agora.' : 'Enviamos um link de redefinição para o seu e-mail.', !error);
      });
    })().catch(() => { document.getElementById('msg').textContent = 'Login indisponível no momento.'; });
  </script>
</body>
</html>
