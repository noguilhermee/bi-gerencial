<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Usuários | Labor Rural</title>
  <link rel="icon" type="image/png" href="./img/lr.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20,500,0,0" rel="stylesheet">
  <link rel="stylesheet" href="./css/admin.css?v=20261001-1">
</head>
<body>
  <header class="topo">
    <div>
      <span class="codigo">ADMINISTRAÇÃO</span>
      <h1>Usuários e acessos</h1>
    </div>
    <div class="topo-acoes">
      <a class="btn" href="/"><span class="material-symbols-rounded">arrow_back</span>Dashboard</a>
      <button class="btn principal" id="btnNovo" type="button"><span class="material-symbols-rounded">person_add</span>Novo usuário</button>
    </div>
  </header>

  <main>
    <p class="aviso" id="aviso" role="status"></p>
    <div class="tabela-box">
      <table>
        <thead>
          <tr><th>Nome</th><th>E-mail</th><th>Perfil</th><th>Acesso a</th><th>Último acesso</th><th>Status</th><th></th></tr>
        </thead>
        <tbody id="corpo"><tr><td colspan="7" class="vazio">Carregando…</td></tr></tbody>
      </table>
    </div>
  </main>

  <dialog id="dlg">
    <form id="form" method="dialog" novalidate>
      <h2 id="dlgTitulo">Novo usuário</h2>
      <label>Nome <input id="fNome" type="text" required autocomplete="off"></label>
      <label>E-mail <input id="fEmail" type="email" required autocomplete="off"></label>
      <label id="lblSenha">Senha (mínimo 8 caracteres) <input id="fSenha" type="text" autocomplete="new-password" minlength="8"></label>
      <label>Perfil
        <select id="fPerfil">
          <option value="ADMIN">Administrador (vê tudo)</option>
          <option value="CONSULTOR">Consultor (só as suas fazendas)</option>
          <option value="AGROINDUSTRIA">Agroindústria (só as suas fazendas)</option>
        </select>
      </label>
      <label id="lblConsultor">Consultor <select id="fConsultor"></select></label>
      <fieldset id="lblAgros"><legend>Agroindústrias</legend><div id="fAgros" class="checks"></div></fieldset>
      <label class="check" id="lblAtivo"><input id="fAtivo" type="checkbox" checked> Acesso ativo</label>
      <p class="erro" id="erro" role="alert"></p>
      <div class="rodape">
        <button class="btn" id="btnCancelar" type="button">Cancelar</button>
        <button class="btn principal" id="btnSalvar" type="submit">Salvar</button>
      </div>
    </form>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./js/auth.js?v=20261001-1"></script>
  <script src="./js/admin.js?v=20261001-1"></script>
</body>
</html>
